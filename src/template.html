<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch Builder</title>
<style>
{{STYLES}}</style>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.6"/>
          <path d="M12 3 C 15 7, 9 9, 12 12 C 15 15, 9 17, 12 21" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Stitch Builder</h1>
      </div>
    </div>
    <div class="step-progress" id="stepProgress">
      <span class="dot" data-step="1"></span> Body
      <span class="dot" data-step="2"></span> Add-ons
    </div>
  </header>

  <div class="layout">

    <!-- BUILDER RAIL -->
    <div class="rail-col">

      <div class="card rail-section">
        <div class="rail-head"><span class="rail-num">1</span><span class="rail-title">Choose a body shape</span></div>
        <div class="shape-grid" id="shapeGrid"></div>

        <div class="body-color-block" id="bodyColorCard" hidden>
          <div class="rail-head"><span class="rail-title" id="bodyColorCardTitle">Pick your yarn color</span></div>
          <div class="body-color-section">
            <img class="body-color-preview" id="bodyColorPreview" alt="">
            <div class="color-picker-inline" id="bodyColorPicker"></div>
          </div>
          <div class="color-mapper-actions">
            <button type="button" class="link-btn" id="launchColorMapperBtn">Launch Color Mapper</button>
            <button type="button" class="link-btn subtle" id="clearColorMapperBtn" hidden>Clear custom colors</button>
          </div>
        </div>
      </div>

      <div class="card rail-section">
        <div class="rail-head"><span class="rail-num">2</span><span class="rail-title">Add pieces</span></div>
        <div class="addon-grid" id="addonGrid"></div>
      </div>

    </div>

    <!-- PATTERN CARD -->
    <div class="card pattern-panel">
      <div class="pattern-head-wrap">
        <div class="pattern-panel-title">
          <div class="pattern-title-group" id="patternTitleGroup">
            <span class="pattern-title-text" id="patternTitleText">New Pattern</span>
            <input class="pattern-title-input" id="patternTitleInput" type="text" maxlength="60" placeholder="New Pattern" hidden>
            <button class="pattern-title-edit" id="patternTitleEditBtn" type="button" aria-label="Rename pattern" title="Rename pattern">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13.5 3.5l3 3L7 16H4v-3L13.5 3.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <button class="btn btn-ghost pattern-head-clear" id="clearBtn" disabled>Start Over</button>
        </div>
        <div class="pattern-head">
          <div class="pattern-photo-item">
            <img class="pattern-photo" id="patternPhoto" src="" alt="" hidden>
            <div id="patternPhotoPlaceholder" class="pattern-photo" style="display:grid;place-items:center;font-size:24px;">🧶</div>
            <div class="pattern-photo-label" id="patternPhotoLabel"></div>
          </div>
          <div class="addon-photos" id="addonPhotos"></div>
          <div class="pattern-meta" id="patternMeta"></div>
        </div>
      </div>
      <div class="pattern-body" id="patternBody">
        <div class="empty-state">Your assembled pattern will build itself here as you make choices on the left.</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="copyBtn" disabled>Copy pattern</button>
        <button class="btn btn-ghost" id="downloadBtn" disabled>Download .txt</button>
        <button class="btn btn-ghost" id="exportDocBtn" disabled>Export to Google Doc</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<div class="cm-modal" id="colorMapperModal" hidden>
  <div class="cm-modal-backdrop" id="cmBackdrop"></div>
  <div class="cm-modal-panel" role="dialog" aria-modal="true" aria-labelledby="cmTitle">
    <div class="cm-modal-head">
      <div>
        <h2 id="cmTitle">Color Mapper</h2>
      </div>
      <button type="button" class="cm-close" id="cmCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="cm-layout">
      <aside class="cm-panel">
        <h3>Yarn color</h3>
        <div id="cmPaletteGrid" class="cm-palette"></div>
        <div id="cmSelectedLabel" class="cm-selected-label">Pick a color, then paint stitches.</div>
        <div id="cmToolRow" class="cm-tool-row">
          <button type="button" class="cm-tool-btn" data-tool="hand" title="Hand — drag to rotate the view">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.4V4.1a1 1 0 0 1 2 0v4.3"/><path d="M8.5 8.4V3.2a1 1 0 0 1 2 0v5.2"/><path d="M10.5 8.4V4.1a1 1 0 0 1 2 0v6.2"/><path d="M12.5 8.7v-2a1 1 0 0 1 2 0v4.8c0 2.7-1.8 4.9-4.5 4.9H8.7c-1.6 0-2.5-.5-3.4-1.6L3.9 10.8c-.5-.6-.4-1.4.2-1.8.6-.4 1.4-.3 1.9.3l1.4 1.6"/></svg>
          </button>
          <button type="button" class="cm-tool-btn selected" data-tool="pencil" title="Pencil — click to paint a stitch, drag to paint a line (right-click erases)">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l.8-3.4L11.6 3.8a1.3 1.3 0 0 1 1.8 0l.8.8a1.3 1.3 0 0 1 0 1.8L6.4 14.2 3 15z"/><path d="M10.2 5.4l2.4 2.4"/></svg>
          </button>
          <button type="button" class="cm-tool-btn" data-tool="bucket" title="Fill bucket — click the shape to fill every stitch with the selected color">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 8.2L8.6 2.4l6.4 6.4a2 2 0 0 1 0 2.9l-2.7 2.7a2 2 0 0 1-2.9 0L2.8 8.2z"/><path d="M2.8 8.2h9.4"/><circle cx="15" cy="14.5" r="1.1" fill="currentColor" stroke="none"/></svg>
          </button>
          <button type="button" class="cm-tool-btn" data-tool="rect" title="Rectangle — drag to fill a block of rounds and stitches">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.8" y="4.8" width="12.4" height="8.4" rx="1.3"/></svg>
          </button>
          <button type="button" class="cm-tool-btn" data-tool="circle" title="Circle — drag to fill a circular area">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="9" r="6.2"/></svg>
          </button>
        </div>
        <h3 class="cm-rounds-head">Rounds</h3>
        <div id="cmRoundsList" class="cm-rounds-list"></div>
      </aside>
      <main class="cm-canvas-area">
        <div class="cm-view-controls">
          <span id="cmHoverInfo" class="cm-hover-info"></span>
        </div>
        <div id="cmThreeWrap" class="cm-three-wrap">
          <button type="button" class="btn btn-ghost cm-reset-view-btn" id="cmResetViewBtn">Reset view</button>
          <canvas id="cmThreeCanvas"></canvas>
        </div>
        <div id="cmLegend" class="cm-legend"></div>
      </main>
      <aside class="cm-panel cm-output-panel">
        <h3>Pattern preview</h3>
        <div id="cmWarnings" class="cm-warnings"></div>
        <pre id="cmPatternPreview" class="cm-pattern-preview"></pre>
        <div class="cm-output-actions">
          <button type="button" class="btn btn-ghost" id="cmCancelBtn">Cancel</button>
          <button type="button" class="btn btn-primary" id="cmApplyBtn">Apply Colors</button>
        </div>
      </aside>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{{SCRIPT}}</script>
